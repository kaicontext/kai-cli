name: build-kai-ci

# Builds the kai-ci toolbox image — the container every Kai CI job pod runs in
# (the PR reviewer via kai-review.yml, the Cloud Agent via kai-agent.yml) — and
# optionally opens the PR that pins the new digest in kai-server.
#
# WHY THIS EXISTS. Until now nothing built this image: it came from whoever ran
# deploy/kai-ci/build.sh on their laptop, against whatever they happened to have
# checked out. The image that runs in production therefore corresponded to no
# commit — the agent image pinned on 2026-09-08 was built with a colleague's
# uncommitted terminal-bridge work in the tree and kai-engine on a feature
# branch. That is not a convenience problem, it is a provenance one: the binary
# deciding what Kai says on a customer's pull request was not reproducible.
#
# WHAT TRIGGERS IT. The image spans FOUR repos (kai-cli and kai-tui supply the
# binaries, kai-engine and kai-core the libraries), so no single repo's push
# means "the image is stale". A RELEASE does: the build takes the newest tag of
# each repo, so the image only goes stale when kai-cli or kai-tui cuts one.
# (kai-core and kai-engine releases reach the image only through the kai-cli
# and kai-tui releases their adopt-engine bots cut.) So both repos' release
# workflows end by sending a `kai-ci-rebuild` repository_dispatch here, and a
# release produces a pin PR without anyone remembering to click "Run". Manual
# dispatch still works, for a rebuild or a pin=agent/both/none run.
#
# A RELEASE-TRIGGERED RUN differs from a manual one in three ways, all because
# one engine release cuts a kai-cli AND a kai-tui release within minutes:
#   - it waits DEBOUNCE_SECONDS before resolving tags, so the sibling release
#     usually lands in time and one image carries both;
#   - it skips the build when production or an open pin PR already carries
#     exactly these versions (the second dispatch of a pair, usually);
#   - its PR closes earlier release-triggered pin PRs it supersedes. Manual
#     pin PRs are never closed.
# It pins the REVIEW image only, as every pin since 2026-10-03 has; the agent
# image is still pinned by hand (pin=agent or pin=both).
#
# WHY IT OPENS A PR RATHER THAN PUSHING. The pin is deliberately a human act.
# From review_default_workflow.go: ":latest meant each rebuild upgraded
# production reviews silently, unbenchmarked. Pinning makes the upgrade a
# deliberate act." This keeps the approval and removes only the typing.
#
# FIRST-RUN PREREQUISITES (both are one-time, and will fail loudly if missing):
#   1. The WIF provider must admit this repository. kai-server's build-ar.yml
#      already assumes gh-deployer via the same provider; if its attribute
#      condition names repositories rather than the owner, kai-cli has to be
#      added. Symptom: the "Authenticate to GCP" step fails with a permission
#      error naming the workload identity pool.
#   2. The Kai App must be installed on kai-server for the pin PR. Symptom: the
#      token step fails saying the repository is not accessible. Building still
#      works — only pin=none is affected.

on:
  workflow_dispatch:
    inputs:
      pin:
        description: 'Open a kai-server PR pinning the new digest'
        required: true
        type: choice
        default: both
        options: [both, agent, review, none]
  # Sent by kai-cli's ci.yml and kai-tui's release.yml after a versioned
  # release publishes. client_payload: {source, version}, for the PR body only.
  repository_dispatch:
    types: [kai-ci-rebuild]

# Not cancel-in-progress: cancelling mid-pin can leave a pushed branch with no
# PR. GitHub keeps one pending run per group, so a burst of dispatches while a
# run is in flight collapses into a single follow-up run.
concurrency:
  group: build-kai-ci
  cancel-in-progress: false

env:
  AR: us-central1-docker.pkg.dev/kaicontext/kai
  IMAGE: us-central1-docker.pkg.dev/kaicontext/kai/kai-ci
  # Release-triggered runs only. Long enough for the sibling release of an
  # engine cascade (kai-cli and kai-tui each take several minutes to publish).
  DEBOUNCE_SECONDS: 600
  WIF_PROVIDER: projects/180761347860/locations/global/workloadIdentityPools/github/providers/github
  WIF_SA: gh-deployer@kaicontext.iam.gserviceaccount.com

# Actions are pinned to commit SHAs, not the @vN tags the rest of this repo
# uses. Deliberate divergence, for this workflow only: it mints repository
# tokens and publishes the image production runs on, so a moving tag means a
# later run can execute action code nobody reviewed — which would hollow out
# the provenance this workflow exists to provide. The trailing comment carries
# the version, and there is no dependabot here, so these need bumping by hand.
permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  # Decides WHAT to build (the newest tag of each module) and WHETHER to: a
  # release-triggered run skips when those versions are already pinned or
  # already up for review. Its own job so the skip is one `if:` on build.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      kai_cli_ref: ${{ steps.resolve.outputs.kai_cli_ref }}
      kai_tui_ref: ${{ steps.resolve.outputs.kai_tui_ref }}
      kai_engine_ref: ${{ steps.resolve.outputs.kai_engine_ref }}
      kai_core_ref: ${{ steps.resolve.outputs.kai_core_ref }}
      build: ${{ github.event_name != 'repository_dispatch' || steps.dedupe.outputs.build == 'true' }}
    steps:
      - name: Wait for the sibling release (release-triggered runs only)
        if: github.event_name == 'repository_dispatch'
        env:
          SOURCE: ${{ github.event.client_payload.source }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          echo "Triggered by the $SOURCE $VERSION release; waiting ${DEBOUNCE_SECONDS}s for any sibling release"
          sleep "$DEBOUNCE_SECONDS"

      - name: Mint App token for the private repos
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: token
        with:
          client-id: ${{ secrets.KAI_CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KAI_CORE_APP_PRIVATE_KEY }}
          owner: kaicontext
          repositories: kai-cli,kai-tui,kai-engine,kai-core

      # ALWAYS the newest released tag of each repo — there is nothing to type.
      # A pin is described by version ("kai-cli v0.35.65 on kai-engine v0.6.55"),
      # so the build works in versions too, and a branch tip is not something
      # anyone can point at afterwards, which is the whole objection this
      # workflow exists to answer. Building from a branch is still possible
      # locally with deploy/kai-ci/build.sh; it just is not what production
      # images are made from.
      #
      # Newest SEMVER TAG, not GitHub's "latest release": those disagree here.
      # kai-engine's newest tag is v0.6.58 while its releases/latest still reads
      # v0.3.0, and kai-core publishes no releases at all — so that endpoint
      # would have silently pinned an engine 55 minor versions stale.
      - name: Resolve refs
        id: resolve
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # No pipe, deliberately. `git ls-remote | head -1` makes head close the
          # pipe while git is still writing, git takes SIGPIPE, and under
          # `set -o pipefail` the whole step dies with exit 141 — which is how
          # the first run of this workflow failed. It is a RACE, not a
          # certainty: the same command passed locally because that tag list was
          # small enough for git to finish first. Reading the output into a
          # variable and slicing the first line in bash removes the race rather
          # than making it rarer.
          latest_tag() {
            local out first
            out="$(git ls-remote --tags --refs --sort=-v:refname \
                     "https://x-access-token:${TOKEN}@github.com/kaicontext/$1" 'v*')"
            [ -n "$out" ] || return 1
            first="${out%%$'\n'*}"
            printf '%s' "${first##*refs/tags/}"
          }
          for m in kai-cli kai-tui kai-engine kai-core; do
            # `if !` rather than a bare assignment: under `set -e` a failing
            # command substitution kills the step with no explanation, and the
            # message below never prints.
            if ! want="$(latest_tag "$m")" || [ -z "$want" ]; then
              echo "no v* tag found for $m — cannot build a versioned image"; exit 1
            fi
            echo "$m: $want"
            echo "$(echo "$m" | tr 'a-z-' 'a-z_')_ref=$want" >> "$GITHUB_OUTPUT"
          done

      - name: Mint App token for kai-server (release-triggered runs only)
        if: github.event_name == 'repository_dispatch'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: server_token
        with:
          client-id: ${{ secrets.KAI_CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KAI_CORE_APP_PRIVATE_KEY }}
          owner: kaicontext
          repositories: kai-server

      # Compared by VERSION, from the "Built from" line every pin PR carries
      # (kai-cli=v0.36.3@ca4a621e60a5 …). Two candidates make a build pointless:
      # the merged pin that set the production review image, and any open pin
      # PR — the latter is what catches the second dispatch of an engine
      # cascade, which arrives after the first has already built and opened.
      # A manual run never skips: rebuilding the same versions is a legitimate
      # thing to ask for (a base-image fix, say).
      - name: Skip versions already pinned or up for review
        id: dedupe
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ steps.server_token.outputs.token }}
          KAI_CLI_REF: ${{ steps.resolve.outputs.kai_cli_ref }}
          KAI_TUI_REF: ${{ steps.resolve.outputs.kai_tui_ref }}
          KAI_ENGINE_REF: ${{ steps.resolve.outputs.kai_engine_ref }}
          KAI_CORE_REF: ${{ steps.resolve.outputs.kai_core_ref }}
        run: |
          set -euo pipefail
          versions() { grep -oE 'kai-(cli|tui|engine|core)=v[^@ ]+' | sort | tr '\n' ' '; }
          WANT="$(printf '%s\n' "kai-cli=$KAI_CLI_REF" "kai-tui=$KAI_TUI_REF" \
                    "kai-engine=$KAI_ENGINE_REF" "kai-core=$KAI_CORE_REF" | versions)"
          echo "want: $WANT"

          # One line per candidate, "#<number> <body on one line>".
          # Production: the newest merged pin PR that moved the REVIEW image
          # (titles have read "pin review image", "pin both image" and "pin the
          # review image"; an agent-only pin says nothing about reviews).
          # Same newest-first assumption as the baseline lookup in the pin job.
          ONE_LINE='"#\(.number) \(.body | gsub("\n"; " "))"'
          CANDIDATES="$(
            gh pr list --repo kaicontext/kai-server --state merged --limit 50 \
              --json number,title,headRefName,body \
              --jq "[.[] | select(.headRefName | startswith(\"kai-ci/pin-\"))
                         | select(.title | test(\"pin (the )?(review|both) image\"))][:1][]
                    | $ONE_LINE"
            gh pr list --repo kaicontext/kai-server --state open --limit 50 \
              --json number,headRefName,body \
              --jq ".[] | select(.headRefName | startswith(\"kai-ci/pin-\")) | $ONE_LINE"
          )"

          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            if [ "$(versions <<<"$pr" || true)" = "$WANT" ]; then
              echo "::notice::kai-server ${pr%% *} already carries $WANT — nothing to build"
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<<"$CANDIDATES"
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      provenance: ${{ steps.refs.outputs.summary }}
    steps:
      # One token for every private checkout below. Scoped to the four module
      # repos, same pattern as ci.yml's builds.
      - name: Mint App token for the private repos
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: token
        with:
          client-id: ${{ secrets.KAI_CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KAI_CORE_APP_PRIVATE_KEY }}
          owner: kaicontext
          repositories: kai-cli,kai-tui,kai-engine,kai-core

      # The Dockerfile's build context is a WORKSPACE ROOT holding the four
      # module dirs side by side, because it rewrites the pinned versions with
      # `go mod edit -replace` to point at them. Reproducing that layout here is
      # what moves the build off a laptop without changing the Dockerfile.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kaicontext/kai-cli
          ref: ${{ needs.resolve.outputs.kai_cli_ref }}
          path: ws/kai-cli
          token: ${{ steps.token.outputs.token }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kaicontext/kai-tui
          ref: ${{ needs.resolve.outputs.kai_tui_ref }}
          path: ws/kai-tui
          token: ${{ steps.token.outputs.token }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kaicontext/kai-engine
          ref: ${{ needs.resolve.outputs.kai_engine_ref }}
          path: ws/kai-engine
          token: ${{ steps.token.outputs.token }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kaicontext/kai-core
          ref: ${{ needs.resolve.outputs.kai_core_ref }}
          path: ws/kai-core
          token: ${{ steps.token.outputs.token }}

      # Resolve the refs to SHAs and keep them. This is the record the manual
      # process never produced: a pin whose provenance is "someone's laptop, one
      # afternoon" cannot be audited or rebuilt.
      - name: Record what is going into the image
        id: refs
        # The refs arrive through env, NOT `${{ }}` inside the script. GitHub
        # substitutes an expression into the script TEXT before bash parses it,
        # so a ref containing a quote closes the assignment and the rest runs as
        # commands — in this job, before it authenticates and pushes to the
        # production registry. Dispatch needs write access, but "only a writer
        # can poison the image build" is not a defence a provenance workflow
        # gets to make.
        env:
          KAI_CLI_REF: ${{ needs.resolve.outputs.kai_cli_ref }}
          KAI_TUI_REF: ${{ needs.resolve.outputs.kai_tui_ref }}
          KAI_ENGINE_REF: ${{ needs.resolve.outputs.kai_engine_ref }}
          KAI_CORE_REF: ${{ needs.resolve.outputs.kai_core_ref }}
        run: |
          set -euo pipefail
          {
            echo "### kai-ci build inputs"
            echo
            echo "| module | ref | sha |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          SUMMARY=""
          for m in kai-cli kai-tui kai-engine kai-core; do
            case "$m" in
              kai-cli)    REF="$KAI_CLI_REF" ;;
              kai-tui)    REF="$KAI_TUI_REF" ;;
              kai-engine) REF="$KAI_ENGINE_REF" ;;
              kai-core)   REF="$KAI_CORE_REF" ;;
            esac
            SHA="$(git -C "ws/$m" rev-parse HEAD)"
            echo "| $m | $REF | \`${SHA:0:12}\` |" >> "$GITHUB_STEP_SUMMARY"
            SUMMARY="${SUMMARY}${m}=${REF}@${SHA:0:12} "
            echo "${m//-/_}_sha=$SHA" >> "$GITHUB_OUTPUT"
          done
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (keyless WIF)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # linux/amd64 only: that is the cluster's arch, and the Dockerfile
      # cross-compiles rather than emulating (emulated CGO builds crash the Go
      # toolchain). NO `:latest` tag, deliberately — a moving tag is the thing
      # digest pinning exists to prevent, and there is a test in kai-server that
      # fails if the review workflow ever references one.
      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ws
          file: ws/kai-cli/deploy/kai-ci/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:cli-${{ steps.refs.outputs.kai_cli_sha }}
            ${{ env.IMAGE }}:run-${{ github.run_number }}
          labels: |
            com.kaicontext.kai-cli=${{ steps.refs.outputs.kai_cli_sha }}
            com.kaicontext.kai-tui=${{ steps.refs.outputs.kai_tui_sha }}
            com.kaicontext.kai-engine=${{ steps.refs.outputs.kai_engine_sha }}
            com.kaicontext.kai-core=${{ steps.refs.outputs.kai_core_sha }}

      # Prove the image can actually run what the workflows invoke. A missing or
      # broken kit surfaces otherwise as a red agent run, minutes into a paid
      # engagement — the failure this whole image exists to avoid.
      - name: Smoke-test the binaries
        run: |
          set -euo pipefail
          REF="${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          docker run --rm --platform linux/amd64 "$REF" sh -c '
            set -e
            for b in kai kit git jq curl; do command -v "$b" >/dev/null || { echo "MISSING: $b"; exit 1; }; done
            kai --version && kit --version'

      - name: Report the digest to pin
        run: |
          {
            echo
            echo "### Pin this"
            echo
            echo '```go'
            echo '${{ env.IMAGE }}@${{ steps.build.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Separate job so a failed pin never casts doubt on a good image: the build
  # above has already pushed and smoke-tested it.
  pin:
    needs: build
    # A release-triggered run has no inputs; it pins the review image.
    if: ${{ (inputs.pin || 'review') != 'none' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # dispatch review-regressions for the before/after
    steps:
      - name: Mint App token for kai-server
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: token
        with:
          client-id: ${{ secrets.KAI_CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KAI_CORE_APP_PRIVATE_KEY }}
          owner: kaicontext
          repositories: kai-server
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kaicontext/kai-server
          token: ${{ steps.token.outputs.token }}

      - name: Bump the pinned digest
        id: bump
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          PROVENANCE: ${{ needs.build.outputs.provenance }}
          IMAGE: ${{ env.IMAGE }}
          PIN: ${{ inputs.pin || 'review' }}
        run: |
          set -euo pipefail
          NEW="${IMAGE}@${DIGEST}"
          BR="kai-ci/pin-${DIGEST:7:12}"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"

          # RE-RUNNABLE. The branch name is derived from the digest, so a re-run
          # of the same build computes the same name — and the first attempt may
          # already have pushed it and then failed later (which is exactly how
          # this was found: attempt 1 pushed the branch and died opening the PR,
          # attempt 2 rebuilt an identical commit and was rejected non-fast-
          # forward). Same digest means the same edit, so an existing branch is
          # already the right branch: reuse it and move on to the PR.
          #
          # Not a force-push. Overwriting a branch someone may have reviewed, to
          # replace it with identical content, is all cost and no benefit.
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
            echo "$BR already exists — an earlier attempt pushed it; reusing"
            exit 0
          fi

          git config user.name "kai-ci"
          git config user.email "noreply@kaicontext.com"
          git checkout -b "$BR"

          # The value goes in through the ENVIRONMENT, not interpolated into the
          # perl program: a digest contains "@sha256", and perl reads a bare @word
          # in a replacement as an array — it silently expands to nothing and
          # turns the pin into a TAG reference. Caught by testing this line
          # against the real files before shipping the workflow.
          # grep -F for the same reason: the digest is not a regex.
          bump() { # file, const
            # Anchored on the const so nothing else in the file can match.
            NEW="$NEW" perl -0pi -e 's{(const '"$2"' = ")[^"]+(")}{$1$ENV{NEW}$2}' "$1"
            grep -qF "$NEW" "$1" || { echo "failed to bump $2 in $1"; exit 1; }
          }
          F=kailab-control/internal/api
          case "$PIN" in
            agent)  bump "$F/agent_default_workflow.go"  defaultAgentImage ;;
            review) bump "$F/review_default_workflow.go" defaultReviewImage ;;
            both)   bump "$F/agent_default_workflow.go"  defaultAgentImage
                    bump "$F/review_default_workflow.go" defaultReviewImage ;;
          esac

          git commit -aqm "build(kai-ci): pin $PIN image to ${DIGEST:7:12}

          Built by kai-cli's build-kai-ci workflow, run ${{ github.run_number }}.

          Modules: ${PROVENANCE}

          The image was smoke-tested before this PR was opened: kai, kit, git,
          jq and curl all resolve inside it and both binaries report a version."
          git push -q origin "$BR"

      - name: Open the pin PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DIGEST: ${{ needs.build.outputs.digest }}
          PROVENANCE: ${{ needs.build.outputs.provenance }}
          IMAGE: ${{ env.IMAGE }}
          PIN: ${{ inputs.pin || 'review' }}
          SOURCE: ${{ github.event.client_payload.source }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          BR="kai-ci/pin-${DIGEST:7:12}"

          # The marker is how a later release-triggered run recognises this PR
          # as one it may supersede; manual pin PRs never carry it.
          TRIGGER=""
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ]; then
            # Payload text lands in the PR body; keep it to a repo name and tag.
            WHAT="a release (unrecognised dispatch payload)"
            [[ "$SOURCE" =~ ^kai-(cli|tui)$ && "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              && WHAT="the **${SOURCE} ${VERSION}** release"
            TRIGGER="Opened automatically after ${WHAT}. <!-- kai-ci:auto -->"
          fi

          # Same idempotency question, other end: a re-run whose branch already
          # carries a PR must not fail trying to open a second one.
          EXISTING="$(gh pr list --repo kaicontext/kai-server --head "$BR" \
                        --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $BR — nothing to do"
            exit 0
          fi

          gh pr create --repo kaicontext/kai-server \
            --head "$BR" --base main \
            --title "build(kai-ci): pin the $PIN image to ${DIGEST:7:12}" \
            --body "$(cat <<EOF
          A new \`kai-ci\` image, built from known refs by [run ${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          \`\`\`
          ${IMAGE}@${DIGEST}
          \`\`\`

          **Built from:** ${PROVENANCE}

          ${TRIGGER}

          Smoke-tested inside the image before this was opened: \`kai\`, \`kit\`, \`git\`, \`jq\` and \`curl\` all resolve, and both binaries report a version.

          Pinning stays a human decision on purpose — this PR removes the laptop build and the hand-copied digest, not the review. Check what changed in the binaries before merging: the reviewer's prompts, model choice and budgets live inside this image, so a bump can change what Kai says on every pull request.
          EOF
          )"

      # A release-triggered pin PR replaces any earlier release-triggered one
      # still open: it carries the newest tag of every module, so it is a
      # superset, and two open pins invite merging the stale one. Only PRs
      # with the kai-ci:auto marker are touched — never a manual pin PR.
      - name: Close the release-triggered pin PRs this one supersedes
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -uo pipefail
          BR="kai-ci/pin-${DIGEST:7:12}"
          NEW="$(gh pr list --repo kaicontext/kai-server --head "$BR" --state open --json number --jq '.[0].number // empty')"
          [ -n "$NEW" ] || { echo "::warning::no open PR for $BR; closing nothing"; exit 0; }
          gh pr list --repo kaicontext/kai-server --state open --limit 50 --json number,headRefName,body \
            --jq ".[] | select(.headRefName | startswith(\"kai-ci/pin-\"))
                      | select(.body | contains(\"<!-- kai-ci:auto -->\"))
                      | select(.number != $NEW) | .number" |
          while read -r old; do
            gh pr close "$old" --repo kaicontext/kai-server --delete-branch \
              --comment "Superseded by #$NEW, built from newer releases." \
              || echo "::warning::could not close #$old"
          done

      # Measure the repin before anyone merges it: replay the regression
      # corpus on the kai-cli this image carries and on the one production pins
      # today, and post the before/after on the pin PR (review-regressions.yml,
      # PIN mode). The baseline is read from the last merged pin PR's "Built
      # from" line, which this job writes. Best effort: a failed dispatch never
      # fails the pin.
      - name: Request the before/after on the pin PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DISPATCH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.build.outputs.digest }}
          PROVENANCE: ${{ needs.build.outputs.provenance }}
        run: |
          set -uo pipefail
          BR="kai-ci/pin-${DIGEST:7:12}"
          PR="$(gh pr list --repo kaicontext/kai-server --head "$BR" --state open --json number --jq '.[0].number // empty')"
          NEW_REF="$(grep -oE 'kai-cli=[^@ ]+' <<<"$PROVENANCE" | head -1 | cut -d= -f2)"
          # By head branch, not by search: the search index lags and misses.
          LAST="$(gh pr list --repo kaicontext/kai-server --state merged --limit 50 --json number,headRefName \
                    --jq 'map(select(.headRefName | startswith("kai-ci/pin-")))[0].number // empty')"
          BASE_REF=""
          [ -n "$LAST" ] && BASE_REF="$(gh pr view "$LAST" --repo kaicontext/kai-server --json body --jq .body \
                                          | grep -oE 'kai-cli=[^@ ]+' | head -1 | cut -d= -f2)"
          if [ -z "$PR" ] || [ -z "$NEW_REF" ] || [ -z "$BASE_REF" ]; then
            echo "::warning::no before/after: pr='$PR' new='$NEW_REF' baseline='$BASE_REF'"; exit 0
          fi
          GH_TOKEN="$DISPATCH_TOKEN" gh workflow run review-regressions.yml --repo "${{ github.repository }}" \
            -f kai_ref="$NEW_REF" -f baseline_ref="$BASE_REF" -f pin_pr="$PR" \
            && echo "requested before/after on kai-server#$PR: $BASE_REF -> $NEW_REF" \
            || echo "::warning::could not dispatch review-regressions"
